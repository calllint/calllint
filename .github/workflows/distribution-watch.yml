# Monitors CallLint's distribution health across all surfaces.
#
# Checks:
# 1. Official MCP Registry presence (io.github.calllint/calllint)
# 2. mcp-v* tag protection (supply chain gate)
# 3. SSOT → projection consistency
#
# READ-ONLY toward the outside world. `scripts/distribution-sources.json` (generated from
# the SSOT) names the primary vendor surfaces this job may consult. Nothing here may open
# an external pull request or issue, submit a form, or contact a maintainer; a fact change
# is reported by failing the job, and any correction lands as an internal change.
#
# Runs: Weekly (Mondays 09:00 UTC), on-demand via workflow_dispatch
#
# Weekly, not daily. Every check here observes a fact that changes on the order of
# weeks — a Registry entry, a tag ruleset, a generator's output for unchanged input.
# Running it daily bought no earlier detection of anything and spent 7x the Actions
# minutes to re-assert the same measurement. `workflow_dispatch` covers the case where
# someone needs an answer now.
#
# Exit: Fails if any check fails → maintainers notified
name: distribution-watch

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly, Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Least scope that lets the baseline-restore step see an artifact from a PREVIOUS run of
  # this workflow. `contents: read` alone cannot list run artifacts. Read-only: nothing in
  # this workflow writes to the Actions API.
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Registry presence
        run: node scripts/verify-registry-presence.mjs

      - name: Check mcp-v* tag protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-mcp-tag-protection.mjs

      # The diff set must be exactly what `generate-distribution-surfaces.mjs` writes —
      # no more, no less. Listing a path the generator does NOT write makes a vacuous
      # assertion: `git diff` on an untouched path always exits 0, so the check reads
      # green while observing nothing.
      #
      # THIS STEP USED TO HAND-LIST 9 PATHS, AND THAT LIST WENT STALE. Measured 2026-08-22:
      # the generator emits 29 projections, so 20 were unguarded here — including
      # `agent-discovery-index.json`, the canonical discovery root, and every published
      # JSON Schema. The failure was structural, not clerical: a hand-maintained mirror of
      # a generator's output drifts every time a projection is added, silently and in the
      # safe-looking direction, which is precisely the vacuity the paragraph above warns
      # about.
      #
      # `--check` is the fix because it cannot go stale: it renders every `emit()` target
      # and byte-compares, so its denominator IS the generator's write set. It also asserts
      # that each target is tracked by git — `git diff` compares the index against the tree
      # and is structurally blind to a never-added file, which has already produced one
      # vacuous green on this workstream.
      #
      # `.well-known/calllint.json` is deliberately NOT a generator target. That path is
      # owned by the Safe-install bake (`packages/trust-index/src/renderDiscoveryManifest.ts`,
      # emitting `calllint.discovery.v1`), which this workflow never runs. The distribution
      # generator used to write it too; that collision silently dropped `resources[]` and is
      # why the generator now carries an explicit "deliberately does NOT write" note. Do not
      # add it back — its schema publishes `additionalProperties: false`, and its drift is
      # covered by the bake's own reproducibility gate.
      # ALSO IN `ci.yml` ON EVERY PR, AND THAT DUPLICATION IS DELIBERATE. Until 2026-08-23
      # this was the only plane that ran it, which meant a PR could break the projections and
      # every status a reviewer saw stayed green until the next Monday — by then the change is
      # on `main` and the red run names a commit nobody is reviewing. PR coverage is the gate;
      # this run is the weekly re-assertion that §19 names, and it is what reports a harness
      # change on a schedule rather than only when someone happens to open a PR. Removing
      # either one loses a distinct guarantee.
      - name: Check projections against the SSOT
        run: node scripts/generate-distribution-surfaces.mjs --check

      # The sitemap is generated too, so the `--check` step above covers it along with every
      # other projection. This step asserts a DIFFERENT question: the promise itself. Every
      # advertised URL resolves, every SSOT host is advertised, every legacy URL is forwarded,
      # and the published coverage block recounts against the SSOT. A sitemap can be perfectly
      # in sync with a generator that emits a dead URL, and a coverage claim can be perfectly
      # reproducible while overstating what shipped.
      # Also in `ci.yml` on every PR as of 2026-08-23 — same reasoning as the step above.
      - name: Check agent, human + crawler surface contract
        run: node scripts/check-agent-surface-contract.mjs

      # new19 §19 names five weekly checks. Three were already covered above; the two below
      # close the rest. Measured, rather than assumed, on 2026-08-22:
      #
      #   Registry presence  → the first step, against the live Registry.
      #   harness changes    → the regenerate-and-diff step, over all 11 generator writes.
      #   marketplace status → PARTIALLY, and the limit is worth stating precisely. There is no
      #                        `marketplaces[]` container in the SSOT and `counts.byType.marketplace`
      #                        is 0; marketplace state lives as `distributionPrimitives[].state` on
      #                        each host (14 kinds today: windsurf-mcp-marketplace, tencent-mcp-market,
      #                        cline-marketplace-pr, …). The diff step therefore guards that those
      #                        recorded states still project correctly — NOT that they still match
      #                        what the vendor's marketplace actually says. That second question is
      #                        what the source observation below samples, and it is why the step is
      #                        described as an observation and not as a gate.
      #
      # The two new steps sit on OPPOSITE sides of the fail/report line, deliberately:
      #
      #   schema changes  → FAILS the job. A schema under our own apps/web/public/ is our
      #                     artifact; changing the $id, un-pinning schemaVersion.const, or
      #                     opening additionalProperties silently breaks every external
      #                     consumer, and it is a CallLint act every time.
      #   source changes  → REPORTS ONLY. A vendor moving their own documentation page is not
      #                     a CallLint defect. Failing on it would train maintainers to ignore
      #                     a red run, and what that habit would mask is the internal drift
      #                     check above — which is a real bug whenever it reds.
      #
      # §19's handling is implemented literally: "No change: silent. Change: generate internal
      # artifact." Neither step opens an external PR or issue, submits a form, or contacts a
      # maintainer; the source check issues anonymous GETs and nothing else.
      # Also in `ci.yml` on every PR as of 2026-08-23. This one is the clearest case for PR
      # coverage: the schemas live under our own `apps/web/public/`, so every change to them is
      # a CallLint act made in a diff, and the consumers it breaks are external.
      - name: Check published schema contract
        run: node scripts/check-published-schema-contract.mjs

      # ── Restore last week's observation so change detection has something to compare to ──
      #
      # WITHOUT THIS STEP THE OBSERVATION BELOW WAS STRUCTURALLY INCAPABLE OF DETECTING
      # CHANGE, and had been since it was written. Measured 2026-08-22: the upload step
      # existed, no download step did, and `artifacts/distribution-watch/` is untracked — so
      # every run started with no baseline, reported `NEW` for all 27 URLs, and never once
      # executed a single STATUS / BODY / REDIRECT comparison. The upload step's own comment
      # claimed it "is what makes week-over-week change detection possible"; uploading is
      # necessary and was not sufficient.
      #
      # It stayed invisible because a missing baseline and a quiet week both print as nothing
      # alarming: `NEW` on everything looks like a healthy first run, every week forever.
      #
      # WHY THIS IS NOT `actions/download-artifact` WITH JUST A NAME. That action defaults to
      # `run-id: ${{ github.run_id }}` — the CURRENT run, which has uploaded nothing at this
      # point. A bare `with: {name: official-sources-snapshot}` therefore downloads nothing
      # and, because the step must tolerate a legitimately absent baseline, would fail
      # quietly and reproduce the exact vacuity this step exists to remove. Reaching a
      # PREVIOUS run's artifact requires resolving that run's id, which is what the API call
      # below does. Ordering is explicit: the repository-level artifact list documents no sort
      # order, so `created_at` is sorted here rather than trusting the response sequence.
      #
      # Two no-baseline cases are legitimate and neither is a defect: the first-ever run, and
      # a gap wider than the 90-day retention window. Both are reported, never inferred — the
      # observation step prints whether it had a baseline, so "compared against nothing" can
      # no longer read as "nothing changed".
      #
      # Reads a CallLint-produced artifact from this repository only. Not a vendor fetch, not
      # a write of any kind. `actions: read` is the least scope that can see a sibling run.
      - name: Restore previous official-source observation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_NAME: official-sources-snapshot
        run: |
          set -euo pipefail
          mkdir -p artifacts/distribution-watch
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${SNAPSHOT_NAME}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)]
                  | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "No unexpired '${SNAPSHOT_NAME}' artifact exists yet — first run, or the"
            echo "90-day retention window lapsed. The observation step will report an absent"
            echo "baseline explicitly; it does not silently treat that as 'no change'."
            exit 0
          fi
          echo "Restoring baseline from run ${run_id}."
          gh run download "$run_id" --name "${SNAPSHOT_NAME}" --dir artifacts/distribution-watch
          ls -la artifacts/distribution-watch

      # `continue-on-error` is belt-and-braces, not the mechanism: the script already exits 0
      # on an unreachable source by design. It is here for the case the script itself dies on
      # an unforeseen runtime fault — an observation step must not be able to fail a run whose
      # other checks are the load-bearing ones.
      #
      # This step is also the §84 weekly DISCOVERY stage, not only the fact-change watch. It
      # observes `candidateFeeds` as well as host sources (27 URLs, of which 1 is a candidate
      # feed) and labels every observation with its kind. Until 2026-08-22 the script read
      # `sources` alone, so the discovery stage fetched nothing at all while the job stayed
      # green — the feed was generated, schema-constrained, invariant-asserted, and never
      # opened. §86 caps what a candidate observation may license: evidence only, human
      # review, and admission as DEFERRED / DISCOVERY_ONLY. Never an extractor, a support
      # page, a support claim, or any external submission.
      #
      # A THIRD KIND was added 2026-08-24: `HARNESS_RELEASE_FEED`, read from the checked-in
      # `artifacts/distribution/agent-harness-watch-list.yml` (12 entries) rather than from the
      # generated manifest. 41 URLs total now — 26 host + 3 candidate-feed + 12 release-feed.
      # It answers a different question from the two above: not "did a vendor change what they
      # SAY" but "did a harness SHIP". On that kind, STATUS and REDIRECT are the load-bearing
      # signals and BODY is not — Codex, gemini-cli and qwen-code publish nightlies, so a body
      # hash change there is expected traffic, while a 404 or a new final URL means the repo
      # moved and an extractor's config-path assumptions may have moved with it. Four of the
      # twelve entries were already stale when the list was written, and the GitHub API follows
      # renames silently, so a wrong `owner/name` returns 200 and reads as healthy.
      #
      # The watch list is deliberately NOT in the SSOT: release feeds are not a published
      # distribution fact, and `distribution-sources.json` carries a "do not hand-edit" banner
      # because it is a generated projection. Keeping the list separate and committed is what
      # bounds this stage — a watch target arrives by reviewable commit, and the job polls
      # exactly what is listed without ever following a link out of it.
      - name: Observe vendor sources, candidate feeds and harness release feeds
        continue-on-error: true
        run: node scripts/check-official-sources.mjs

      # The observation is only useful if a human can read it, and the artifact is ALSO the
      # baseline the next run compares against — which is why the restore step above exists.
      # Together they give week-over-week detection without committing a file that churns
      # weekly. Retention is the real limit: a gap wider than 90 days loses the baseline, and
      # the observation step reports that state rather than hiding it.
      - name: Upload official-source observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-sources-snapshot
          path: artifacts/distribution-watch/official-sources.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      # Deliberately terse, and deliberately free of restated verdicts. The previous
      # version printed "Registry: LIVE" as a string literal, which is the same defect the
      # readback script had: a claim that costs nothing to print and is true whether or not
      # anything was measured. Each step above prints its own measured assertions, and a
      # failing step fails the job. This step adds no facts.
      - name: Report status
        if: success()
        run: echo "Distribution health -- all checks above passed."
