# Main CI for CallLint. Runs the full quality gate on every push and PR:
# typecheck, tests, build, and both smoke layers (built-artifact + real npm
# pack/install). This workflow NEVER publishes to npm and NEVER executes a
# scanned MCP server — CallLint only ever inspects configs statically.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # The per-OS matrix. Its check names are "test (ubuntu-latest)" etc. — a matrix
  # cannot BE the single required status check, so branch protection requires the
  # `build-and-test` aggregator below (which fans in on all three legs). Keeping the
  # required check name stable means no ruleset change was needed to matrix CI.
  test:
    # Cross-OS matrix (ADR 0037 §6): the real-filesystem apply E2E — the single
    # audited config writer, exercised through the production node fs port — must
    # pass on Windows, macOS, and Linux for a host to be Tier A. Running the whole
    # suite on all three also catches path/line-ending assumptions early.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; our run: steps are POSIX sh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Evidence audit
        run: pnpm audit:evidence

      # Public-copy + version-consistency guard. Static, no build needed:
      # asserts website/README/agent docs and the internal status docs
      # (ROADMAP/PROJECT_STATUS/PROJECT_HEALTH) stay in sync with
      # project-facts.json and never overclaim. Catches copy/version
      # drift on every PR — not just in the local ci:local script.
      - name: Public-copy + version guard
        run: pnpm check:public-copy

      - name: Build the CLI bundle
        run: pnpm build

      # Corpus release gate: scans the BUILT CLI against pinned verdict contracts.
      # Fully offline and never executes a scanned server. Seed cases are
      # deterministic; remove this step only if corpus calibration is in flux.
      - name: Corpus calibration gate
        run: pnpm corpus:test

      # Agent-trust-bench: proves SkillSpector (content) and CallLint (authority)
      # are complementary. Drives the BUILT CLI with `scan --evidence` over
      # committed fixtures; fully offline, never runs SkillSpector or the server.
      - name: Agent-trust-bench complementarity gate
        run: pnpm bench:test

      # Calibration + coverage drift. Both compare a committed report against a
      # fresh run; neither enforces a gate here (`--gate` does that at publish
      # time). Present so a stale report cannot reach `main` — they were
      # `ci:local`-only until Gate 2.4-H flagged the local-green/remote-blind gap.
      - name: Calibration audit (drift)
        run: pnpm audit:calibration

      - name: Coverage audit (drift)
        run: pnpm audit:coverage

      # Phase 2.4 evaluation gates (Batch 9). All four are drift-checks: the
      # committed artifact under artifacts/phase-2.4/ must be byte-identical to a
      # fresh run. Gates 2.4-D/E/G drive the BUILT binary, so these must follow
      # the build step above. Every run sandboxes --host-config into a temp dir
      # and none executes a scanned target (INV-2.4-09). Running them across the
      # three-OS matrix is also what proves the artifacts are OS-portable — a
      # claim `ci:local` on one machine cannot make.
      - name: Phase 2.4 cognitive + agent-contract evals (drift)
        run: pnpm eval:phase-2.4

      - name: Phase 2.4 five-fixture E2E dogfood (drift)
        run: pnpm eval:phase-2.4:dogfood

      - name: Phase 2.4 gates A/D/E/F/H (drift)
        run: pnpm eval:phase-2.4:gates

      # Structural validation of the human-panel store only. It never asserts a
      # response count: Gate 2.4-B needs ≥10 real humans and no CI run can
      # supply them, so an empty store is valid and stays PENDING_HUMAN_PANEL.
      - name: Phase 2.4 human-panel store validation
        run: pnpm eval:phase-2.4:panel:validate

      # Workstream P (ADR 0058 §1/§5). Two runs, deliberately: --check catches
      # artifact drift, --gate ENFORCES the boundary. The gate is what stops a later
      # Workstream P batch from moving an L3 string (a value that reaches
      # contractDigest) into an editable config file — the one mistake that would
      # silently invalidate every sealed install plan.
      - name: Workstream P presentation-plane audit (drift)
        run: pnpm audit:presentation

      - name: Workstream P presentation-plane audit (INV-P1/P2 gate)
        run: pnpm audit:presentation:gate

      # The P-1 digest seams. The gate's teeth: zero prose leaves may survive into
      # the semantic preimage, so a contract field carrying a sentence fails here
      # until somebody classifies it — and no packages/*/src file may IMPORT the
      # config plane, enforced before apps/web/content/** exists to be imported.
      - name: Workstream P presentation lock (drift)
        run: pnpm audit:presentation:lock

      - name: Workstream P presentation lock (digest-seam gate)
        run: pnpm audit:presentation:lock:gate

      # new15 §14's four acceptance-gate blocks (配置完整性 · 页面一致性 · 安全隔离 ·
      # 视觉回归), which nothing ran before P-6. The gate's teeth are 安全隔离: a hostile
      # publisher string reaching the DOM, configured copy reaching an agent protocol
      # trigger, or a configured token moving a sealed digest all fail here.
      - name: Workstream P preview & snapshot harness (drift)
        run: pnpm audit:preview

      - name: Workstream P preview & snapshot harness (§14 gate)
        run: pnpm audit:preview:gate

      # Gate S0's regression mode (S0-OPEN-2). NOT `--gate`: that mode enforces the
      # 25-record vertical slice, which is short on `main` today (19), so wiring it
      # would pin CI red for a reason no PR under review can clear — only merging the
      # registry expansion can. NOT report mode either, which was S0-OPEN-2's own
      # suggested remedy: measured, it exits 0 unconditionally, so it would add a step
      # with no failing mode. `--regression` enforces the four assertion tiers plus a
      # monotonic cohort floor, and reports the 25-record shortfall as census. ~8s.
      # Quoted deliberately: an unquoted `: ` inside this scalar makes the WHOLE file
      # unparseable, and a text-matching reader cannot see that (control #177).
      - name: "Gate S0 (regression: assertions + cohort ratchet)"
        run: pnpm gate:s0:regression

      - name: Package smoke (shipped artifact)
        run: pnpm smoke

      - name: Pack + isolated install smoke
        run: pnpm pack:smoke

      - name: Pack + stdio smoke (calllint-mcp)
        run: pnpm pack:smoke:mcp

  # The deploy ledger's AUTHENTICITY layer — the one check in this repo that
  # requires full git history, and therefore the one check the `test` matrix
  # provably cannot make (ADR 0079).
  #
  # WHY A SEPARATE JOB. `scripts/presentation-ledger.ts` splits into two layers on
  # purpose: `validateOffline` recomputes every digest from the stored document and
  # runs anywhere, while `validate` adds the two checks that need history — each
  # entry's commit is an ancestor of HEAD, and the stored document is byte-identical
  # to the document at that commit. The matrix checks out at depth 1, so historical
  # shas are unknown objects there; `historyIsReachable()` measures that and the git
  # layer stands down rather than failing for a reason unrelated to the claim. That
  # is correct for the matrix and it left this fault class with NO automated reader:
  # a squash-merge rewrites the sha a ledger entry recorded, so the entry becomes an
  # ancestor of nothing and only a full clone can see it. It happened twice (#249,
  # #293), both times found by a human running the suite locally after the merge.
  #
  # `fetch-depth: 0` lives HERE and not on the matrix deliberately: cloning full
  # history three times over would pay for it on every OS while the claim is
  # OS-independent, and the matrix's own reproducibility gates depend on the shallow
  # checkout staying cheap. One job, one full clone, one obligation.
  #
  # This job is in `build-and-test`'s `needs` — without that it would report a
  # status nothing blocks a merge on (`wired/aggregator-reachable`, ADR 0071).
  ledger-authenticity:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # The whole point of this job: `validate`'s git layer reads historical commits,
      # and a depth-1 clone has none of them.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Not install-free: the script imports the real digest functions from
      # `packages/trust-index/src` rather than re-deriving them, so the ledger and
      # the shipped renderers cannot disagree about what a digest is.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when an entry names a commit this branch never had — the squash-merge
      # dangling-ref class, and any doctored entry whose stored document does not
      # match the document at its own commit.
      - name: Presentation deploy ledger (authenticity — needs full history)
        run: pnpm ledger:presentation:validate

      # ADR 0084 D3. Second tenant of this job, and for the same structural reason the
      # first one is here: the check reads a PREVIOUS REVISION of the committed cohort
      # snapshot, which a depth-1 clone does not have.
      #
      # WHY NOT ON THE MATRIX, where `gate:s0:regression` already calls the same
      # function: there it can only ever return `refused`, so it would be a step with
      # no failing mode — the exact defect ADR 0084 was written about, reintroduced by
      # its own guard. `--regression` still prints the outcome (a witness must not be
      # silenceable by choosing a mode) but does not enforce it; `--identity` enforces
      # it here, where a refusal means the guard lost its evidence rather than "as
      # designed".
      #
      # The teeth: a COUNT-NEUTRAL substitution — one name dropped, one gained, cohort
      # size unchanged — leaves `gate:s0:regression` green because its ratchet is
      # `censusRegistry < FLOOR`. That is not hypothetical; `agency.goji/goji` left the
      # cohort that way between the 2026-08-10 and 2026-08-15 snapshots and CI stayed
      # green. A de-listing is REPORTABLE, not automatically a fault (D4): naming it in
      # an ADR clears this step.
      - name: "Gate S0 (identity: no subject left the cohort — needs full history)"
        run: pnpm gate:s0:identity

  # Aggregator: the single required status check on `main`. It passes only when
  # every leg of the `test` matrix passed, so branch protection stays a stable,
  # single context name (`build-and-test`) while CI fans out across three OSes.
  # `if: always()` + explicit result check means a skipped/failed leg fails this
  # gate too (a matrix leg that is cancelled must not read as a pass).
  #
  # `ledger-authenticity` is checked the same way and for the same reason: a job
  # whose failure the required check does not read is a status, not a gate.
  build-and-test:
    needs: [test, ledger-authenticity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix 'test' result was '${{ needs.test.result }}' — failing the gate."
            exit 1
          fi
          echo "All cross-OS matrix legs passed."

      - name: Require the ledger authenticity job to have succeeded
        run: |
          if [ "${{ needs.ledger-authenticity.result }}" != "success" ]; then
            echo "'ledger-authenticity' result was '${{ needs.ledger-authenticity.result }}' — failing the gate."
            echo "A ledger entry names a commit this branch never had, or a stored document does not match its commit."
            echo "After a squash merge, reseat the newest entry: pnpm ledger:presentation:reseat"
            exit 1
          fi
          echo "Deploy ledger passed the git authenticity layer on a full clone."
