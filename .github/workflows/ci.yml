# Main CI for CallLint. Runs the full quality gate on every push and PR:
# typecheck, tests, build, and both smoke layers (built-artifact + real npm
# pack/install). This workflow NEVER publishes to npm and NEVER executes a
# scanned MCP server — CallLint only ever inspects configs statically.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # The per-OS matrix. Its check names are "test (ubuntu-latest)" etc. — a matrix
  # cannot BE the single required status check, so branch protection requires the
  # `build-and-test` aggregator below (which fans in on all three legs). Keeping the
  # required check name stable means no ruleset change was needed to matrix CI.
  test:
    # Cross-OS matrix (ADR 0037 §6): the real-filesystem apply E2E — the single
    # audited config writer, exercised through the production node fs port — must
    # pass on Windows, macOS, and Linux for a host to be Tier A. Running the whole
    # suite on all three also catches path/line-ending assumptions early.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; our run: steps are POSIX sh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Evidence audit
        run: pnpm audit:evidence

      # Public-copy + version-consistency guard. Static, no build needed:
      # asserts website/README/agent docs and the internal status docs
      # (ROADMAP/PROJECT_STATUS/PROJECT_HEALTH) stay in sync with
      # project-facts.json and never overclaim. Catches copy/version
      # drift on every PR — not just in the local ci:local script.
      - name: Public-copy + version guard
        run: pnpm check:public-copy

      - name: Build the CLI bundle
        run: pnpm build

      # Corpus release gate: scans the BUILT CLI against pinned verdict contracts.
      # Fully offline and never executes a scanned server. Seed cases are
      # deterministic; remove this step only if corpus calibration is in flux.
      - name: Corpus calibration gate
        run: pnpm corpus:test

      # Agent-trust-bench: proves SkillSpector (content) and CallLint (authority)
      # are complementary. Drives the BUILT CLI with `scan --evidence` over
      # committed fixtures; fully offline, never runs SkillSpector or the server.
      - name: Agent-trust-bench complementarity gate
        run: pnpm bench:test

      # Calibration + coverage drift. Both compare a committed report against a
      # fresh run; neither enforces a gate here (`--gate` does that at publish
      # time). Present so a stale report cannot reach `main` — they were
      # `ci:local`-only until Gate 2.4-H flagged the local-green/remote-blind gap.
      - name: Calibration audit (drift)
        run: pnpm audit:calibration

      - name: Coverage audit (drift)
        run: pnpm audit:coverage

      # Phase 2.4 evaluation gates (Batch 9). All four are drift-checks: the
      # committed artifact under artifacts/phase-2.4/ must be byte-identical to a
      # fresh run. Gates 2.4-D/E/G drive the BUILT binary, so these must follow
      # the build step above. Every run sandboxes --host-config into a temp dir
      # and none executes a scanned target (INV-2.4-09). Running them across the
      # three-OS matrix is also what proves the artifacts are OS-portable — a
      # claim `ci:local` on one machine cannot make.
      - name: Phase 2.4 cognitive + agent-contract evals (drift)
        run: pnpm eval:phase-2.4

      - name: Phase 2.4 five-fixture E2E dogfood (drift)
        run: pnpm eval:phase-2.4:dogfood

      - name: Phase 2.4 gates A/D/E/F/H (drift)
        run: pnpm eval:phase-2.4:gates

      # Structural validation of the human-panel store only. It never asserts a
      # response count: Gate 2.4-B needs ≥10 real humans and no CI run can
      # supply them, so an empty store is valid and stays PENDING_HUMAN_PANEL.
      - name: Phase 2.4 human-panel store validation
        run: pnpm eval:phase-2.4:panel:validate

      # Workstream P (ADR 0058 §1/§5). Two runs, deliberately: --check catches
      # artifact drift, --gate ENFORCES the boundary. The gate is what stops a later
      # Workstream P batch from moving an L3 string (a value that reaches
      # contractDigest) into an editable config file — the one mistake that would
      # silently invalidate every sealed install plan.
      - name: Workstream P presentation-plane audit (drift)
        run: pnpm audit:presentation

      - name: Workstream P presentation-plane audit (INV-P1/P2 gate)
        run: pnpm audit:presentation:gate

      # The P-1 digest seams. The gate's teeth: zero prose leaves may survive into
      # the semantic preimage, so a contract field carrying a sentence fails here
      # until somebody classifies it — and no packages/*/src file may IMPORT the
      # config plane, enforced before apps/web/content/** exists to be imported.
      - name: Workstream P presentation lock (drift)
        run: pnpm audit:presentation:lock

      - name: Workstream P presentation lock (digest-seam gate)
        run: pnpm audit:presentation:lock:gate

      - name: Package smoke (shipped artifact)
        run: pnpm smoke

      - name: Pack + isolated install smoke
        run: pnpm pack:smoke

      - name: Pack + stdio smoke (calllint-mcp)
        run: pnpm pack:smoke:mcp

  # Aggregator: the single required status check on `main`. It passes only when
  # every leg of the `test` matrix passed, so branch protection stays a stable,
  # single context name (`build-and-test`) while CI fans out across three OSes.
  # `if: always()` + explicit result check means a skipped/failed leg fails this
  # gate too (a matrix leg that is cancelled must not read as a pass).
  build-and-test:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix 'test' result was '${{ needs.test.result }}' — failing the gate."
            exit 1
          fi
          echo "All cross-OS matrix legs passed."
