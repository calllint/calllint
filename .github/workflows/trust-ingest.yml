# Scheduled Trust Index ingestion (Phase I / I1b — ADR 0038 §3, ADR 0046 §3).
#
# This is the SOLE scanner of the public Trust Index and is STRUCTURALLY decoupled
# from serving: it fetches the Official MCP Registry, writes a retained snapshot
# (ADR 0038 §1), re-bakes all cohorts into apps/web/public/trust, and opens a PR.
# It NEVER deploys — deploy-web.yml runs only on merge to main. So Actions scans,
# a human reviews the diff, and only then does Cloudflare Pages serve it. The two
# cannot share a deployable (design §4 decision 3).
#
# Network happens ONLY here (never at serve time, never in CI): CI on the resulting
# PR re-bakes from the committed snapshot PURELY and diffs, so the fetched result is
# frozen into a reviewable, reproducible artifact before it can reach the public.
name: trust-ingest

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour to avoid the cron stampede; weekly
    # because the cohort is small and each run needs human review before it ships.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    # The operator's knobs, wired to the three `resolve*` readers in `refreshSnapshot.ts`.
    #
    # Every one is OPTIONAL and defaults to the empty string, which is exactly the input each
    # resolver treats as "absent" (`raw == null || raw.trim() === ""` → the derived default). So a
    # bare dispatch with no inputs filled is byte-for-byte the scheduled run, and a scale-out is a
    # form field rather than a code change. That equivalence is the point: the previous file
    # asserted in a comment that these were "settable as a workflow_dispatch input", while
    # `workflow_dispatch:` carried no `inputs:` at all and the step carried no `env:` — the claim
    # named a knob the operator did not have.
    #
    # Typed `string`, not `number`: an empty `number` input coerces to `0`, and `0` is a value the
    # resolvers REJECT (`n <= 0` → default). It would still fail safe, but it would take the
    # "invalid, fall back" path on every unfilled run instead of the "absent" path — a silent
    # difference in which branch the default comes from. `string` keeps absence absent.
    inputs:
      max_entries:
        description: "Served cohort cap (TRUST_INGEST_MAX_ENTRIES). Blank = cumulative auto-growth (+50 per run, up to 500)."
        required: false
        type: string
        default: ""
      mirror_max_entries:
        description: "Raw-read ceiling (TRUST_INGEST_MIRROR_MAX_ENTRIES). Must exceed the cohort cap, else ignored."
        required: false
        type: string
        default: ""
      mirror_max_pages:
        description: "Page-count ceiling (TRUST_INGEST_MIRROR_MAX_PAGES). Blank = DEFAULT_MAX_PAGES."
        required: false
        type: string
        default: ""

# Least privilege: write a branch + open a PR. No broader scope; no deploy secrets.
permissions:
  contents: write
  pull-requests: write

# Never run two ingests at once; let an in-flight one finish (don't cancel a bake).
concurrency:
  group: trust-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # PINNED, and it is a load-bearing number rather than hygiene.
    #
    # The mirror's page ceiling is argued in WALL CLOCK (`officialRegistry.ts`): a ceiling the job
    # cannot reach before it is killed is not the limit that binds — the timeout is, and a timeout
    # truncates SILENTLY. The runner kills the process, no `MirrorIncompleteError` is constructed,
    # and `assertMirrorComplete` never runs. That is the one truncation this repo's fail-closed
    # guard cannot see, so the budget it is argued against must be EXPLICIT here and not inherited.
    #
    # 300 min against a measured full walk of 7090s ≈ 118 min (653 pages, 65_235 records,
    # 2026-08-04) — ~2.5x the measurement, and below GitHub's 360-min job maximum so the number is
    # ours rather than the platform's. Left implicit, the job would inherit exactly that 360, i.e.
    # the ceiling would be argued against a limit no line in this repo states.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      # ONE instant for the whole ingest, computed once and shared by every step below.
      #
      # Four modules read `TRUST_INGEST_NOW` and each falls back to its own `new Date()`:
      # `refreshSnapshot` (`fetchedAt`), `resolveEvidence` (`resolvedAt`), `projectAdoptionIndex`
      # (`projectedAt`), `bake` (`bakedAt`). Unset, one ingest therefore stamps FOUR different
      # instants minutes apart, and the resulting artifacts cannot be checked against each other:
      # `projectedAt == fetchedAt` is a real invariant the reproducibility gate pins, and with
      # per-step clocks it holds only because the pure projection re-reads the snapshot's own stamp.
      # Every other cross-artifact comparison is left unstateable.
      #
      # Not `date -u` inline per step — that is the bug, not the fix. It is computed HERE, once, and
      # exported so the steps cannot drift from one another.
      - name: Pin one instant for the whole ingest
        run: echo "TRUST_INGEST_NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — `eval:phase-2.4:gates:write` below drives the real binary
        # THE STEP WHOSE ABSENCE KILLED TWO CONSECUTIVE SCHEDULED INGESTS.
        #
        # Runs 32004879519 (2026-08-17) and 32700871694 (2026-08-24) both failed here-but-one-step-later,
        # at "Refresh the derived phase-2.4 artifacts", with:
        #
        #   missing apps/cli/dist/index.js — run `pnpm build` first (Gates 2.4-D/E drive the real binary)
        #   ELIFECYCLE  Command failed with exit code 2.
        #
        # `phase-2.4-gates.ts:84` resolves `apps/cli/dist/index.js` and exits 2 when it is absent
        # (:1045). `dist/` is gitignored, so a fresh runner never has it — this workflow had NO `pnpm
        # build` at all (measured: `grep -c "pnpm build"` = 0). ADR 0089 added the refresh step and its
        # invariant test asserted the writers were INVOKED; neither asserted they could RUN. That is
        # this repo's dominant fault class one level up: a guard that cannot observe its subject, here a
        # guard observing invocation while the thing that fails is the precondition.
        #
        # The cost was not the red run, it was the SILENCE after it: the failing step sits BEFORE "Open
        # a PR with the refreshed snapshot + pages", so two weeks of scheduled ingests mirrored the
        # registry, baked the tree, and threw all of it away without opening a PR. The cohort stayed
        # frozen at 100 entries and the 100→150 growth in `refreshSnapshot.ts` never got a chance to
        # apply. A pipeline that fails after its expensive half and before its only output is
        # indistinguishable from a quiet week.
        #
        # PLACED HERE, NOT NEXT TO THE STEP THAT NEEDS IT, for two reasons:
        #   1. It is `ci.yml`'s order (build at :122, phase-2.4 checks from :154), and the refresh step
        #      exists precisely to reproduce what `ci.yml` will check on the resulting PR.
        #   2. It fails in ~2 minutes instead of after a ~2-hour registry mirror. A broken build
        #      discovered at minute 130 costs the whole ingest; discovered here it costs nothing.
        #
        # Writes only into gitignored `dist/` (measured: tree stays clean after `pnpm build`), so it
        # cannot contribute bytes to the PR this workflow opens.
        run: pnpm build

      - name: Ingest — mirror the registry, project + retain the snapshot, report the change
        # The caps are LEFT TO THE DEFAULTS on purpose. `DEFAULT_MIRROR_MAX_ENTRIES` (100_000) and
        # `DEFAULT_MAX_PAGES` (1000) are argued from a walk of the live source that ran to
        # EXHAUSTION (653 pages / 65_235 records / 7090s, 2026-08-04) and against this job's
        # `timeout-minutes` above; they are set to bind at the same read. Pinning either number a
        # second time here would create a copy that drifts from the one the tests pin, and the
        # scheduled run is exactly where a stale copy would be least visible.
        #
        # `TRUST_INGEST_MIRROR_MAX_ENTRIES` / `TRUST_INGEST_MIRROR_MAX_PAGES` exist for the
        # operator: when `MirrorIncompleteError` names one in its remedy, it is settable as a
        # workflow_dispatch input without a code change — see `inputs:` above, which is what makes
        # that sentence true. It was NOT true when this comment first claimed it: `workflow_dispatch:`
        # was bare and this step had no `env:`, so the only remedy was editing this file. A remedy
        # naming a knob the operator does not have is not a remedy.
        #
        # On a scheduled run `github.event.inputs.*` is null and `||` yields `""` — the same absent
        # value an unfilled dispatch sends, so the defaults above stay the defaults here.
        env:
          TRUST_INGEST_MAX_ENTRIES: ${{ github.event.inputs.max_entries || '' }}
          TRUST_INGEST_MIRROR_MAX_ENTRIES: ${{ github.event.inputs.mirror_max_entries || '' }}
          TRUST_INGEST_MIRROR_MAX_PAGES: ${{ github.event.inputs.mirror_max_pages || '' }}
        run: pnpm ingest:trust-index

      - name: Resolve evidence — identity-only resolution of remote endpoints (ADR 0050)
        # The SECOND (and last) network step. Reads the retained registry snapshot,
        # runs the read-only P1 resolvers over each remote endpoint (INV1: no exec,
        # no probe), and freezes the results into a retained evidence snapshot
        # (packages/trust-index/snapshots/evidence-snapshot.json).
        run: pnpm resolve-evidence:trust-index

      - name: Project the adoption index — purely, from the committed snapshot (ADR 0061 §8.1)
        # NOT a network step, and it does NOT open the compiler's database. `--from-snapshot` makes
        # the committed artifact a pure function of committed bytes, stamped `snapshot.fetchedAt`,
        # so anyone can re-derive it and byte-compare. The bake below then reads that committed file
        # purely: "nothing served ever queries the compiler" (ADR 0061 §5).
        #
        # THIS STEP USED `:store`, AND THE REASON GIVEN FOR IT WAS FALSE. The old comment said the
        # store variant was required because `persistIdentity` had just written the `firstSeenAt`
        # history "no derivation can reconstruct". The first clause is true and the conclusion does
        # not follow: `adoptionIndexProjection`'s field set is
        # `subjectId, canonicalName, canonicalSlug, identityStatus, identityDigest, lastSeenAt` —
        # `firstSeenAt` IS NOT IN IT (measured: 0 of 100 committed entries carry the field). The step
        # was defending a column that never reaches the artifact, so `:store` bought nothing and
        # spent reproducibility: what it actually did was make the committed bytes depend on whatever
        # rows that runner's database happened to hold.
        #
        # ADR 0061 §8.1's own consequence line said this step "stays correct BECAUSE Actions' store
        # is cold". Measured on 2026-08-17, that premise is falsified — see ADR 0087 — and it was
        # never the load-bearing half anyway: a cold store makes the two paths AGREE, which is an
        # argument for the pure path, not for the one that can disagree.
        #
        # Ordering no longer matters for correctness (a pure projection cannot read a previous run's
        # identity), but it stays after the ingest so the snapshot it reads is this run's.
        run: pnpm project-adoption-index:trust-index

      - name: Re-bake with evidence — refine remote UNKNOWN verdicts (ADR 0050)
        # Pure re-bake: reads BOTH committed snapshots and refines remote UNKNOWN
        # pages to REVIEW where identity resolved cleanly. No network, no clock.
        run: pnpm bake:trust-index

      - name: Sync the MCP server's bundled data from the freshly baked tree
        # THE STEP THAT DID NOT EXIST, AND WHOSE ABSENCE WAS PAID FOR BY HAND.
        #
        # Two committed files under `packages/calllint-mcp/src/data/` must be byte-identical to what
        # `apps/web/public/` serves, each enforced by an anti-drift test in the normal suite
        # (`committed-lookup-drift.test.ts`, `committed-contracts-drift.test.ts`). The bake above
        # rewrites the served tree — so every ingest that changes a page also invalidates the bundle,
        # and without this step the PR this workflow opens arrives with a RED CI by construction.
        #
        # That is what happened on the 2026-08-17 ingest: the tests were satisfied by a human
        # remembering to copy two files, because `lookup-index.json` had no generator at all and
        # `adoption-contracts.json`'s generator was never wired into `package.json`. The remedy for a
        # guard has to be runnable, or the guard is satisfied by luck.
        #
        # Writes rather than `--check`es, deliberately, and it is the ONE exception to this job's
        # "never rewrite committed bytes in an automated run" instinct: these two files are pure
        # derivations of the bake in the same commit, so regenerating them is finishing the bake, not
        # editing a source. Everything a reviewer must approve is still in the diff. `--check` is
        # what CI runs on the resulting PR.
        run: pnpm sync:mcp-bundle

      - name: Refresh the derived phase-2.4 artifacts from the freshly baked tree
        # THE SAME DEFECT AS THE STEP ABOVE, ONE CLASS WIDER — and the step above did not fix it.
        #
        # `sync:mcp-bundle` was added (ADR 0087) for the two files under `packages/calllint-mcp/src/data/`.
        # But those are not the only committed bytes that are a pure function of the baked tree. Five
        # artifacts under `artifacts/phase-2.4/` are too, each enforced by a `--check` step in `ci.yml`
        # that fails when the file drifts from a fresh run:
        #
        #   human-five-second-test.json      `pnpm eval:phase-2.4`            reads public/install/*/index.html
        #   gate-A-consistency.json          `pnpm eval:phase-2.4:gates`      reads public/install + public/trust
        #   presentation-plane-audit.json    `pnpm audit:presentation`        reads public/install + public/trust
        #   presentation-lock.json           `pnpm audit:presentation:lock`   reads public/install
        #   preview-snapshot.json            `pnpm audit:preview`             reads public/install
        #
        # `bake.ts` `rmSync`es and rewrites `public/install` wholesale, so any ingest that moves the
        # cohort invalidates all five. Measured on the 2026-08-17 ingest: 205 install pages changed and
        # all five artifacts went stale, which is FIVE red CI checks on a PR this workflow opened —
        # again by construction, and again paid for by hand.
        #
        # This is the general shape ADR 0087 named without closing: the remedy for a guard has to be
        # runnable. `tests/invariants/derived-artifact-freshness.invariants.test.ts` now enumerates the
        # class from `ci.yml` itself, so a sixth such artifact cannot be added without either appearing
        # here or failing that test.
        #
        # Order matters here and did not for the bundle: `preview-snapshot.ts` READS
        # `human-five-second-test.json`, so the eval must run before it. This is `ci.yml`'s order.
        # `eval:phase-2.4:dogfood` is NOT here: it drives the five canonical fixtures through the built
        # binary in a temp sandbox, reads no served page, and was measured still exit-0 after the bake
        # that staled the other five. Rebuilding it would be a false demand — and the invariant asserts
        # its absence, so this list and that test cannot drift apart.
        run: pnpm eval:phase-2.4:write && pnpm eval:phase-2.4:gates:write && pnpm audit:presentation:write && pnpm audit:presentation:lock:write && pnpm audit:preview:write

      - name: Guard the regenerated pages (no overclaim / PII; completeness)
        run: pnpm check:public-copy

      # ── What this bot is allowed to have touched ────────────────────────────────────────────
      # Until ADR 0091 this job wrote only DATA: snapshots, baked pages, derived artifacts. The
      # ratchet advance made it write SOURCE for the first time — `scripts/gate-s0.ts`, which is a
      # GATE. `create-pull-request` commits whatever is dirty, with no `add-paths`, so the commit's
      # scope is decided by "what happened to be dirty" rather than by anything declared. That was
      # tolerable while every writer produced generated output; it is not tolerable now that one
      # writer edits a gate.
      #
      # `add-paths` is not the answer: a legitimate run dirties hundreds of generated files across
      # four trees, so enumerating them would be a second copy of the generator's output contract,
      # wrong the first time a page is added. Instead this asserts the ONE boundary that matters —
      # inside scripts/, only gate-s0.ts may change, and only its floor, and only upward.
      - name: Assert the ingest touched no source but the ratchet floor
        run: |
          set -uo pipefail
          fail=0

          # `git status --porcelain`, NOT `git diff --name-only`: diff compares the working tree to
          # the INDEX, so a file already `git add`ed is invisible to it, and an untracked file is
          # invisible twice over. create-pull-request commits staged, unstaged AND untracked, so a
          # guard reading `git diff` would be watching a smaller set than the one that ships —
          # measured 2026-08-28, when a staged scripts/sneaky.ts passed this step exit-0.
          stray=$(git status --porcelain -- scripts/ | awk '{print $NF}' | grep -v '^scripts/gate-s0\.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::the ingest modified source files it has no business touching:"
            printf '  %s\n' $stray
            fail=1
          fi

          # Same reason, and `git diff HEAD` throughout below so a STAGED edit is still read.
          if [ -z "$(git status --porcelain -- scripts/gate-s0.ts)" ]; then
            echo "✓ scope: the ratchet held this run — gate-s0.ts untouched"
          else
            # Only the floor's digits may move. Any other hunk in a gate is a red, whatever it says.
            other=$(git diff HEAD -U0 -- scripts/gate-s0.ts \
              | grep -E '^[+-][^+-]' \
              | grep -vE '^[+-]const S0_REGRESSION_FLOOR = [0-9]+$' || true)
            if [ -n "$other" ]; then
              echo "::error::gate-s0.ts changed OUTSIDE the ratchet floor declaration — a bot may not edit gate logic:"
              printf '  %s\n' "$other"
              fail=1
            fi
            before=$(git diff HEAD -U0 -- scripts/gate-s0.ts | sed -nE 's/^-const S0_REGRESSION_FLOOR = ([0-9]+)$/\1/p' | head -1)
            after=$(git diff HEAD -U0 -- scripts/gate-s0.ts | sed -nE 's/^\+const S0_REGRESSION_FLOOR = ([0-9]+)$/\1/p' | head -1)
            if [ -z "$before" ] || [ -z "$after" ]; then
              echo "::error::gate-s0.ts is dirty but the floor's before/after could not be read (got '${before:-<none>}' -> '${after:-<none>}') — scope is unobservable, so it is not assumed safe."
              fail=1
            elif [ "$after" -le "$before" ]; then
              # advanceRatchetFloor is Math.max, so this is unreachable by that code path. It is
              # asserted anyway: the point is that NOTHING reaches the branch, not that one caller
              # promises not to. A ratchet that can fall is not a ratchet.
              echo "::error::the ratchet floor did not RISE ($before -> $after). A ratchet may only ever advance (ADR 0083 D1, ADR 0091 D3)."
              fail=1
            else
              echo "✓ scope: gate-s0.ts changed in exactly one place — ratchet floor $before -> $after (rising)"
            fi
          fi

          [ "$fail" = 0 ] || exit 1

      - name: Open a PR with the refreshed snapshot + pages
        # peter-evans/create-pull-request: widely used, actively maintained. It
        # commits the working-tree changes to a branch and opens/updates one PR.
        # No-ops cleanly when the bake produced no diff (registry unchanged).
        uses: peter-evans/create-pull-request@v7
        with:
          branch: trust-ingest/registry-refresh
          title: "chore(trust): refresh Official MCP Registry snapshot + Trust Pages"
          commit-message: "chore(trust): scheduled registry ingestion (snapshot + bake)"
          body: |
            Automated Trust Index ingestion (I1b, ADR 0038 §3).

            - Refreshed the retained Official MCP Registry snapshot
              (`packages/trust-index/snapshots/official-mcp-registry.json`).
            - Resolved remote-endpoint identity into the retained evidence snapshot
              (`packages/trust-index/snapshots/evidence-snapshot.json`, ADR 0050).
            - Projected the canonical adoption graph's identity plane into
              (`packages/trust-index/snapshots/adoption-index.json`, ADR 0061 §7.1).
              Identity and addressing only — it carries no verdict, and cannot:
              `computeVerdict` stays the only verdict engine (ADR 0061 §4).
            - Re-baked all cohorts into `apps/web/public/trust/`, refining remote
              UNKNOWN → REVIEW where identity resolved cleanly (never SAFE).
            - **Advanced Gate S0's regression ratchet** (`scripts/gate-s0.ts`,
              `S0_REGRESSION_FLOOR`) to the cohort this run committed (ADR 0091).
              This edits a GATE, so it is called out separately: the advance is
              `max(floor, cohort)` and is structurally incapable of lowering the
              floor, so a shrunken cohort leaves it at its high-water mark and CI
              reds. A falling floor is not something this workflow can produce.

              You do not have to take that on trust, or check it by eye: the
              **"Assert the ingest touched no source but the ratchet floor"** step
              above ran before this PR was opened. It fails the run if anything under
              `scripts/` changed other than `gate-s0.ts`, if `gate-s0.ts` changed
              anywhere other than the floor declaration, or if the floor did not
              rise. It reads `git status`, so a staged or untracked file cannot slip
              past it either. This is the only source file the ingest may write.

            CI re-bakes from the committed snapshots and diffs (reproducibility gate),
            and the public-copy guard enforces the ADR 0038 language/PII/completeness
            boundaries. Review the page diff, then merge — **merging deploys** via
            `deploy-web.yml`. This workflow never deploys on its own.
          labels: trust-ingest, automated
          delete-branch: true
