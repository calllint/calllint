# Private usage report build (new18 §28, §29).
#
# Generates the operator-facing usage report, uploads it as a WORKFLOW ARTIFACT,
# and deploys it to the Access-gated private host. It never commits:
#
#   §28 — the repository holds the generator, template, tests and this workflow.
#         Daily values stay artifacts, so no metric is ever committed to git.
#   §29 — was fail-closed until an operator confirmed Cloudflare Access on the
#         private host. That confirmation happened 2026-08-24 (recorded in
#         artifacts/authority-distribution-closure/CLOUDFLARE_ACCESS_ACTION.md:
#         Access app + single-email allow policy, verified by an unauthenticated
#         request landing on the Access sign-in gate). The deploy step below is
#         gated on that fact, not on this comment.
#
# The report is intentionally allowed to be INCOMPLETE. When npm or D1 cannot be
# read, the generator emits em dashes rather than zeros (§25: a zero is a claim
# about the world, and an unread source cannot support one) and this job still
# succeeds — with the degradation printed in the run summary. A hard failure here
# would teach the operator to ignore a red cron, which is worse than a report
# that says plainly which source was unavailable.
name: usage-report

on:
  schedule:
    # Daily 06:31 UTC. npm's range API lags a day, so the generator asks for
    # yesterday and any time after ~06:00 UTC has that day complete. Off the hour
    # to dodge the cron stampede, and well clear of the ingress Worker's own
    # 03:17 retention sweep so a long delete never overlaps this read.
    - cron: "31 6 * * *"
  workflow_dispatch:

# Least privilege: this job reads the repo, writes an artifact, and deploys to
# Cloudflare Pages via API token. It has no repo write (nothing is committed) and
# no GitHub Pages scope (deploys to Cloudflare, not GitHub Pages).
permissions:
  contents: read

# One report build at a time; let an in-flight one finish rather than racing two
# writers against the same D1 read.
concurrency:
  group: usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ─────────────────────────────────────────────────────────────────────────────────────
      # AC-32 supply-chain gate: this workflow publishes to Cloudflare Pages with credentials,
      # so an unreviewed commit must not reach it. The gate asserts that HEAD descends from
      # the protected `main` branch via the tag-protection contract (AC-32, verified by
      # `verify-mcp-tag-protection.mjs`). Fails the run if the ancestry property is broken.
      #
      # INTERNAL-ONLY ARTIFACT. The usage report is behind Cloudflare Access, never seen by
      # users, and doesn't ship code anyone executes — so the blast radius is "stale numbers
      # on an operator dashboard", not "shipped an unreviewed MCP server". The gate still
      # runs because:
      #   1. Uniform discipline across all publish paths is simpler than a two-tier policy.
      #   2. release-ancestry-coverage.invariants.test.ts enforces it, and exempting
      #      internal-only deploys is follow-up work not yet scoped.
      #   3. The runtime cost is ~2s and the script already exists.
      # ─────────────────────────────────────────────────────────────────────────────────────
      - name: Release ancestry gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ancestry.mjs

      # wrangler comes from apps/usage-worker's devDependencies, not from npx.
      # The generator resolves it from node_modules by path (it runs the resolved
      # JS entry on `node` to avoid the Windows .cmd shim and any shell quoting of
      # the SQL it passes), so an npx-cached copy would be invisible to it and the
      # D1 half would degrade even with credentials present.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The renderer is pure and unit-tested; run those tests before trusting
      # today's output. A renderer that started emitting zeros for absent data
      # would otherwise ship a misleading report on a green cron.
      - name: Test the renderer and the npm chunk arithmetic
        run: pnpm vitest run apps/usage-worker

      # Reported, not enforced. Absent D1 credentials the usage rows degrade to
      # "not observed" and the distribution half is still worth having, so this
      # states what the run can see instead of gating on it.
      - name: Report which sources this run can read
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "D1: credentials present — observed-usage rows will be populated."
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absent — observed-usage rows will render as not-yet-observed (em dashes), never as zeros (new18 §25)."
          fi

      - name: Generate the private usage report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The generator validates before it writes (noindex present, no <script>,
        # no off-host reference, no NaN) and exits non-zero writing nothing if any
        # check fails. So a corrupt report cannot become an artifact.
        run: pnpm usage:report --out dist/usage

      # §29: an artifact, never a deploy. Retained 14 days — long enough to
      # compare a fortnight of runs, short enough that operator-visible figures
      # do not accumulate indefinitely in Actions storage.
      - name: Upload the report as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: usage-report
          path: dist/usage
          retention-days: 14
          if-no-files-found: error

      # §29 now satisfied: Cloudflare Access is live (verified 2026-08-24), deploy
      # the report to usage.calllint.com. The artifact upload stays (provides a
      # downloadable copy for 14 days), and the deploy makes it reachable at the
      # private host. Access gate confirmed by unauthenticated curl test.
      - name: Deploy to usage.calllint.com (behind Cloudflare Access)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/usage-worker
          npx wrangler pages deploy ../../dist/usage \
            --project-name=calllint-usage-report \
            --branch=main \
            --commit-dirty=true

      # Verify that Access is actually enforcing — an unauthenticated request must
      # land on the sign-in gate and must not leak report content. This guards
      # against Access policy deletion or misconfiguration; without this step, the
      # deploy would keep running even if the host became public.
      - name: Verify Access gate is enforcing (unauthenticated probe)
        run: |
          response=$(curl -sSf https://usage.calllint.com/ 2>&1 || true)
          if echo "$response" | grep -qi "calllint usage report\|server details\|installation hashes\|npm downloads"; then
            echo "::error::Access gate failed — unauthenticated request returned report content"
            exit 1
          fi
          if ! echo "$response" | grep -qi "cloudflare access\|sign in"; then
            echo "::warning::Could not confirm Access gate presence (did not detect Cloudflare Access sign-in page)"
            echo "Response: $response"
            exit 1
          fi
          echo "✓ Access gate confirmed — unauthenticated request redirected to sign-in, no content leaked"

      - name: Summarize the run
        run: |
          {
            echo "### Private usage report"
            echo
            echo "Built as an artifact (\`usage-report\`) and deployed to the Access-gated host."
            echo "**Never committed** — new18 §28."
            echo
            echo "- Artifact: this run's Artifacts section (14-day retention)"
            echo "- Private host: https://usage.calllint.com (Cloudflare Access, single-email policy)"
            echo
            echo "Any metric shown as an em dash means that source could not be read; it does"
            echo "**not** mean the figure is zero (§25)."
          } >> "$GITHUB_STEP_SUMMARY"
