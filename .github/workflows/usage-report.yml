# Private usage report build (new18 §28, §29).
#
# Generates the operator-facing usage report, uploads it as a WORKFLOW ARTIFACT,
# and deploys it to the Access-gated private host. It never commits:
#
#   §28 — the repository holds the generator, template, tests and this workflow.
#         Daily values stay artifacts, so no metric is ever committed to git.
#   §29 — was fail-closed until an operator confirmed Cloudflare Access on the
#         private host. That confirmation happened 2026-08-24 (recorded in
#         artifacts/authority-distribution-closure/CLOUDFLARE_ACCESS_ACTION.md:
#         Access app + single-email allow policy, verified by an unauthenticated
#         request landing on the Access sign-in gate). The deploy step below is
#         gated on that fact, not on this comment.
#
# The report is intentionally allowed to be INCOMPLETE. When npm or D1 cannot be
# read, the generator emits em dashes rather than zeros (§25: a zero is a claim
# about the world, and an unread source cannot support one) and this job still
# succeeds — with the degradation printed in the run summary. A hard failure here
# would teach the operator to ignore a red cron, which is worse than a report
# that says plainly which source was unavailable.
name: usage-report

on:
  schedule:
    # Daily 06:31 UTC. npm's range API lags a day, so the generator asks for
    # yesterday and any time after ~06:00 UTC has that day complete. Off the hour
    # to dodge the cron stampede, and well clear of the ingress Worker's own
    # 03:17 retention sweep so a long delete never overlaps this read.
    - cron: "31 6 * * *"
  workflow_dispatch:

# Least privilege: this job reads the repo, writes an artifact, and deploys to
# Cloudflare Pages via API token. It has no repo write (nothing is committed) and
# no GitHub Pages scope (deploys to Cloudflare, not GitHub Pages).
permissions:
  contents: read

# One report build at a time; let an in-flight one finish rather than racing two
# writers against the same D1 read.
concurrency:
  group: usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ─────────────────────────────────────────────────────────────────────────────────────
      # AC-32 supply-chain gate: this workflow publishes to Cloudflare Pages with credentials,
      # so an unreviewed commit must not reach it. The gate asserts that HEAD descends from
      # the protected `main` branch via the tag-protection contract (AC-32, verified by
      # `verify-mcp-tag-protection.mjs`). Fails the run if the ancestry property is broken.
      #
      # INTERNAL-ONLY ARTIFACT. The usage report is behind Cloudflare Access, never seen by
      # users, and doesn't ship code anyone executes — so the blast radius is "stale numbers
      # on an operator dashboard", not "shipped an unreviewed MCP server". The gate still
      # runs because:
      #   1. Uniform discipline across all publish paths is simpler than a two-tier policy.
      #   2. release-ancestry-coverage.invariants.test.ts enforces it, and exempting
      #      internal-only deploys is follow-up work not yet scoped.
      #   3. The runtime cost is ~2s and the script already exists.
      # ─────────────────────────────────────────────────────────────────────────────────────
      - name: Release ancestry gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ancestry.mjs

      # wrangler comes from apps/usage-worker's devDependencies, not from npx.
      # The generator resolves it from node_modules by path (it runs the resolved
      # JS entry on `node` to avoid the Windows .cmd shim and any shell quoting of
      # the SQL it passes), so an npx-cached copy would be invisible to it and the
      # D1 half would degrade even with credentials present.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The renderer is pure and unit-tested; run those tests before trusting
      # today's output. A renderer that started emitting zeros for absent data
      # would otherwise ship a misleading report on a green cron.
      - name: Test the renderer and the npm chunk arithmetic
        run: pnpm vitest run apps/usage-worker

      # Reported, not enforced. Absent D1 credentials the usage rows degrade to
      # "not observed" and the distribution half is still worth having, so this
      # states what the run can see instead of gating on it.
      - name: Report which sources this run can read
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "D1: credentials present — observed-usage rows will be populated."
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absent — observed-usage rows will render as not-yet-observed (em dashes), never as zeros (new18 §25)."
          fi

      - name: Generate the private usage report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The generator validates before it writes (noindex present, no <script>,
        # no off-host reference, no NaN) and exits non-zero writing nothing if any
        # check fails. So a corrupt report cannot become an artifact.
        run: pnpm usage:report --out dist/usage

      # §29: an artifact, never a deploy. Retained 14 days — long enough to
      # compare a fortnight of runs, short enough that operator-visible figures
      # do not accumulate indefinitely in Actions storage.
      - name: Upload the report as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: usage-report
          path: dist/usage
          retention-days: 14
          if-no-files-found: error

      # §29 now satisfied: Cloudflare Access is live (verified 2026-08-24), deploy
      # the report to usage.calllint.com. The artifact upload stays (provides a
      # downloadable copy for 14 days), and the deploy makes it reachable at the
      # private host. Access gate confirmed by unauthenticated curl test.
      - name: Deploy to usage.calllint.com (behind Cloudflare Access)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          cd apps/usage-worker
          # Tee, so the deployment URL can be read by the verification step below. That URL
          # is the ONLY authoritative liveness signal available once the pages.dev subdomain
          # is disabled: Access 302s before authenticating (measured 2026-08-26 — even a
          # path that cannot exist gets the same 302), so the gated host cannot testify
          # about its own origin, and a disabled subdomain leaves nothing else to ask.
          npx wrangler pages deploy ../../dist/usage \
            --project-name=calllint-usage-report \
            --branch=main \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          status=${PIPESTATUS[0]}

          # Judge the OUTPUT, not just the exit code. Asserted POSITIVELY: the success
          # marker must be PRESENT. "no error appeared" is satisfied by empty output, which
          # is exactly how this repo's guards have failed before.
          if ! grep -q "Deployment complete" /tmp/deploy.log; then
            echo "::error::wrangler did not report 'Deployment complete' — no deployment landed."
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9]+\.calllint-usage-report\.pages\.dev' /tmp/deploy.log | head -1)
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "✓ deployed: ${url:-<url not parsed, but 'Deployment complete' was reported>}"
          exit "$status"

      # Verify that Access is actually enforcing — an unauthenticated request must
      # land on the sign-in gate and must not leak report content. This guards
      # against Access policy deletion or misconfiguration; without this step, the
      # deploy would keep running even if the host became public.
      - name: Verify Access gate is enforcing (unauthenticated probe)
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -uo pipefail
          HOST=https://usage.calllint.com/
          ORIGIN=https://calllint-usage-report.pages.dev/
          fail=0

          # ── Why this probe was rewritten (2026-08-26) ───────────────────────────────────
          # The original could not pass on a CORRECTLY configured host, in either spelling:
          #   · without -L it read the 302's body — a 7-line stub whose only word is
          #     "cloudflare" — and required "sign in", so the gate check always failed;
          #   · with -L it landed on the Access login page, whose <title> renders the
          #     APPLICATION NAME "CallLint Usage Report (Private)", tripping the leak check.
          # And its four leak markers ("calllint usage report", "server details",
          # "installation hashes", "npm downloads") match NOTHING in the real report, whose
          # title is "CallLint Usage — private" and whose rows read "CLI package downloads".
          # Measured 2026-08-26: 0/4 matched the generated report; 1/4 matched the Access
          # page. The check was blind to a real leak and loud on the safe case — inverted.
          # So: gate presence is now a REDIRECT fact (structural), and the leak markers are
          # pinned to real report strings by report-leak-markers.invariants.test.ts.

          # 1. Gate present? An unauthenticated GET must 302 to the Access login endpoint.
          loc=$(curl -sSI --max-time 25 "$HOST" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}')
          case "$loc" in
            *cloudflareaccess.com/cdn-cgi/access/login*)
              echo "✓ gate: unauthenticated GET redirects to the Cloudflare Access sign-in endpoint" ;;
            *)
              echo "::error::Access gate NOT observed — no redirect to cloudflareaccess.com (got: ${loc:-<none>})"
              fail=1 ;;
          esac

          # 2. No leak? The un-redirected response must carry no real report content. Markers
          #    are report row labels, absent from any Access page.
          curl -sS -o /tmp/gate-body.html --max-time 25 "$HOST" || true
          if grep -qiE 'CLI package downloads|MCP servers observed|Recorded preflights' /tmp/gate-body.html; then
            echo "::error::Access gate failed — unauthenticated request returned report content"
            fail=1
          else
            echo "✓ leak: no report row labels in the unauthenticated response"
          fi

          # 3. Is anything actually SERVED behind the gate? THE CHECK WHOSE ABSENCE HID A
          #    USER-VISIBLE 502 FOR AS LONG AS THE DEPLOY HAS EXISTED. Checks 1-2 are both
          #    satisfied by a gate in front of NOTHING: Access authenticates, proxies to a
          #    Pages project with zero deployments, and the operator gets 502 *after* signing
          #    in — while this workflow stays green. "Gated" and "dead" must not look alike.
          #
          #    LIVENESS COMES FROM THE DEPLOY STEP, NOT FROM PROBING A HOSTNAME. Two measured
          #    facts forced that (both 2026-08-26):
          #      a) The gated host cannot testify about its own origin — Access 302s BEFORE
          #         authenticating, identically for a path that cannot exist.
          #      b) Probing $ORIGIN raced the alias: the deploy reported complete at
          #         13:36:19.16 and this step read 522 half a second later, then 200 minutes
          #         on. A retry would only trade a false red for a sleep that hides a truly
          #         empty origin.
          #    So `wrangler`'s own "Deployment complete" + deployment URL is the signal. It is
          #    authoritative and immune to alias propagation.
          #
          #    ONE KNOWN LIMIT, stated rather than hidden: $DEPLOYMENT_URL is a per-deployment
          #    hostname, so this proves THIS deployment serves — not that the production alias
          #    does. Cloudflare offers no way to observe the gated custom domain without a
          #    credential the pipeline deliberately does not hold
          #    (artifacts/authority-distribution-closure/CLOUDFLARE_ACCESS_ACTION.md), so that
          #    gap is accepted, not closed. Note also that per-deployment hostnames fall under
          #    the `*.{project}.pages.dev` PREVIEW wildcard: if the preview Access policy is
          #    ever enabled (Pages → Settings → General → "Enable access policy"), this check
          #    will read a 302 and must be revisited — it is not covered today.
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "::error::the deploy step published no deployment URL — nothing is known to be live."
            fail=1
          else
            dcode=$(curl -sS -o /tmp/deployment-body.html -w '%{http_code}' --max-time 25 "$DEPLOYMENT_URL" || echo 000)
            case "$dcode" in
              200) echo "✓ origin: deployment live at the immutable deployment URL (HTTP 200)" ;;
              000|404|522)
                # The deployment-specific hostname is created by the deploy itself, so unlike
                # the alias it is not subject to alias propagation. A failure here after
                # "Deployment complete" is a real fault, not a race.
                echo "::error::the deployment URL from this run is not serving (HTTP $dcode). wrangler reported success, so this is a genuine origin fault."
                fail=1 ;;
              *) echo "::warning::deployment URL returned HTTP $dcode — not a known-bad code, treating as live." ;;
            esac
          fi

          # 4. §29: the report must not be world-readable. Access binds to a HOSTNAME, so a
          #    policy on the custom domain alone leaves the report public at pages.dev the
          #    moment a deploy lands — measured 2026-08-26: 200, 2666 bytes, all three row
          #    labels present, and NO x-robots-tag (that header ships on preview hostnames
          #    only), so the in-page noindex meta is the sole crawler backstop there.
          #
          #    THIS CHECK OBJECTS ONLY TO CONTENT, never to absence. Cloudflare provides no
          #    way to delete a project's pages.dev hostname (verified against the Pages docs
          #    2026-08-26 — the documented options are a Bulk Redirect or a second Access
          #    application), so whatever remediation lands, this hostname keeps resolving and
          #    answers with a redirect or a challenge rather than the report. Reading any of
          #    that as "no live deployment" — which this probe did until 2026-08-26 — reports a
          #    CORRECT configuration as the very 502 it exists to catch. Hence liveness moved
          #    to check 3, and every non-content response below is a pass.
          ocode=$(curl -sS -o /tmp/origin-body.html -w '%{http_code}' --max-time 25 "$ORIGIN" || echo 000)
          if grep -qiE 'CLI package downloads|MCP servers observed|Recorded preflights' /tmp/origin-body.html; then
            # Not a secret leak (no credentials, no raw IDs — those never leave the Worker),
            # but §29 makes "public" the violation, so this is an error, not a warning.
            echo "::error::$ORIGIN serves report content UNGATED (HTTP $ocode) — Access covers the custom domain only."
            echo "::error::Remediate: Cloudflare has NO switch to delete this hostname (verified against the Pages docs 2026-08-26). Use an account-level Bulk Redirect from $ORIGIN to https://usage.calllint.com/, or add a second Access application covering *.pages.dev. Note that Pages → Settings → General → 'Enable access policy' does NOT cover this hostname — it protects preview deployments only."
            fail=1
          elif [ "$ocode" = "000" ]; then
            echo "✓ §29: $ORIGIN does not resolve or refused the connection — no content exposed"
          else
            echo "✓ §29: $ORIGIN serves no report content (HTTP $ocode)"
          fi

          [ "$fail" = 0 ] || exit 1
          echo "✓ Access gate confirmed — gated, no content leaked, and a live deployment behind it"

      - name: Summarize the run
        run: |
          {
            echo "### Private usage report"
            echo
            echo "Built as an artifact (\`usage-report\`) and deployed to the Access-gated host."
            echo "**Never committed** — new18 §28."
            echo
            echo "- Artifact: this run's Artifacts section (14-day retention)"
            echo "- Private host: https://usage.calllint.com (Cloudflare Access, single-email policy)"
            echo
            echo "Any metric shown as an em dash means that source could not be read; it does"
            echo "**not** mean the figure is zero (§25)."
          } >> "$GITHUB_STEP_SUMMARY"
