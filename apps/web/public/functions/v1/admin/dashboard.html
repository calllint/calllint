<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallLint Usage Observatory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 2rem;
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #00ff88; font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .metric-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .metric-label {
      color: #888;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .metric-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #00ff88;
    }
    .events-table {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      color: #888;
      font-weight: 600;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333;
    }
    td {
      padding: 0.75rem 0;
      border-bottom: 1px solid #222;
    }
    .loading { color: #888; font-style: italic; }
    .error { color: #ff4444; }
    footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #333;
      color: #666;
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ CallLint Usage Observatory</h1>
    <p class="subtitle">Privacy-first telemetry • Aggregate metrics only</p>

    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label">Active Installations</div>
        <div class="metric-value" id="active-installations">—</div>
        <div class="metric-label" style="margin-top:0.5rem">Last 30 days</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Events</div>
        <div class="metric-value" id="total-events">—</div>
      </div>
    </div>

    <div class="events-table">
      <h2 style="margin-bottom:1rem; color:#e0e0e0">Events by Type</h2>
      <table id="events-table">
        <thead>
          <tr>
            <th>Event Name</th>
            <th style="text-align:right">Count</th>
          </tr>
        </thead>
        <tbody id="events-tbody">
          <tr><td colspan="2" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <footer>
      <p>Privacy: Raw installation IDs never persisted • HMAC-only storage • 90-day retention</p>
      <p style="margin-top:0.5rem">Protected by Cloudflare Access</p>
    </footer>
  </div>

  <script>
    async function loadMetrics() {
      try {
        const response = await fetch('/v1/admin/usage')
        if (!response.ok) throw new Error('Failed to fetch')
        const data = await response.json()

        document.getElementById('active-installations').textContent = data.activeInstallations.toLocaleString()
        document.getElementById('total-events').textContent = data.totalEvents.toLocaleString()

        const tbody = document.getElementById('events-tbody')
        tbody.innerHTML = ''
        for (const [name, count] of Object.entries(data.eventsByName).sort((a, b) => b[1] - a[1])) {
          const row = tbody.insertRow()
          row.insertCell(0).textContent = name
          row.insertCell(1).textContent = count.toLocaleString()
          row.cells[1].style.textAlign = 'right'
        }
      } catch (err) {
        document.getElementById('active-installations').textContent = 'Error'
        document.getElementById('active-installations').className = 'metric-value error'
        document.getElementById('events-tbody').innerHTML = '<tr><td colspan="2" class="error">Failed to load data</td></tr>'
      }
    }

    loadMetrics()
    setInterval(loadMetrics, 60000) // Refresh every minute
  </script>
</body>
</html>
